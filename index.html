<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070504" />
    <title>DIVI GARBA</title>
    <meta
      name="description"
      content="Ten nights. One circle. Divi Garba, 11 — 20 October 2026 at Master Farm, B/s Sardardham, Vaishnodevi Circle."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://cdn.sortmyscene.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- SortMyScene booking widget. It binds itself to `data-trigger`, so
         the header's #buy-btn opens the checkout — nothing to wire up in
         React, and no click handler of our own on that button (adding one
         would open it twice).

         Deliberately at the end of <body>, not in <head>. The embed
         watches for late-mounted triggers with a MutationObserver — which
         is what makes a React-rendered button work at all — but that
         observer starts with `if (!MutationObserver || !document.body)
         return;`. An async script in <head> can execute before <body>
         exists (easily so on a warm CDN cache), and then the observer
         never starts, nothing ever binds, and the button is silently
         dead. Down here the body is guaranteed to exist. -->
    <script
      src="https://cdn.sortmyscene.com/embed.js"
      data-event-id="6a981a7a2a894a5381e4911b"
      data-trigger="#buy-btn"
      data-bg="#000000"
      async
    ></script>
  </body>
</html>
